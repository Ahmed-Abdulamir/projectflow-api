name: Project Check

on:
  push:
  pull_request:

jobs:
  project-check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "README.md",
            "CMakeLists.txt",
            "main.cpp",
            "database/schema.sql",
            "run.example.ps1",
            "tests/smoke_test.ps1",
            "controllers/TaskController.cpp",
            "controllers/ProjectController.cpp",
            "controllers/CommentController.cpp",
            "controllers/ActivityController.cpp",
            "services/TaskService.cpp",
            "services/ProjectService.cpp",
            "services/CommentService.cpp",
            "services/ActivityService.cpp",
            "repositories/TaskRepository.cpp",
            "repositories/ProjectRepository.cpp",
            "repositories/CommentRepository.cpp",
            "repositories/ActivityRepository.cpp"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required file is missing: $file"
            }
          }

          Write-Host "All required files exist."

      - name: Check secrets are not committed
        shell: pwsh
        run: |
          if (Test-Path "run.ps1") {
            throw "run.ps1 must not be committed because it may contain local secrets."
          }

          if (Test-Path ".env") {
            throw ".env must not be committed because it may contain secrets."
          }

          Write-Host "No local secret files found."

      - name: Check README content
        shell: pwsh
        run: |
          $readme = Get-Content "README.md" -Raw

          $requiredSections = @(
            "ProjectFlow API",
            "Tech Stack",
            "Features",
            "Architecture",
            "API Endpoints",
            "Activity Log",
            "Smoke Tests",
            "Local Setup"
          )

          foreach ($section in $requiredSections) {
            if ($readme -notmatch [regex]::Escape($section)) {
              throw "README is missing section: $section"
            }
          }

          Write-Host "README contains required sections."

      - name: Check database schema content
        shell: pwsh
        run: |
          $schema = Get-Content "database/schema.sql" -Raw

          $requiredTables = @(
            "CREATE TABLE projects",
            "CREATE TABLE tasks",
            "CREATE TABLE comments",
            "CREATE TABLE activity_logs"
          )

          foreach ($table in $requiredTables) {
            if ($schema -notmatch [regex]::Escape($table)) {
              throw "schema.sql is missing: $table"
            }
          }

          Write-Host "Database schema contains required tables."